<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Página del vendedor</title>


    <style>

        /* =====================================================
           CONFIGURACIÓN GENERAL
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }


        /* =====================================================
           BARRA SUPERIOR
        ===================================================== */

        .barra-vendedor {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 68px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 8px 15px;

            background: rgba(0, 0, 0, 0.78);

            backdrop-filter: blur(8px);

            z-index: 1000;
        }


        .informacion-vendedor {

            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;
        }


        .foto-mini {

            width: 45px;
            height: 45px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid white;

            flex-shrink: 0;
        }


        .nombre-mini {

            font-size: 14px;

            font-weight: bold;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .agencia-mini {

            font-size: 11px;

            opacity: 0.8;

            margin-top: 3px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .botones-superiores {

            display: flex;

            gap: 7px;

            flex-shrink: 0;
        }


        .boton-contacto {

            width: 38px;
            height: 38px;

            border: none;

            border-radius: 50%;

            background: white;

            font-size: 17px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        /* =====================================================
           BIENVENIDA
        ===================================================== */

        .bienvenida {

            min-height: 100vh;

            padding: 100px 20px 50px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-marca {

            width: 150px;

            max-width: 60%;

            margin-bottom: 22px;

            object-fit: contain;
        }


        /* =====================================================
           FOTO VENDEDOR
        ===================================================== */

        .foto-vendedor {

            width: 120px;
            height: 120px;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid white;

            margin-bottom: 15px;
        }


        /* =====================================================
           INFORMACIÓN
        ===================================================== */

        .bienvenida h1 {

            font-size: 32px;

            font-weight: 800;

            margin-bottom: 7px;
        }


        .puesto {

            font-size: 17px;

            opacity: 0.9;

            margin-bottom: 22px;
        }


        /* =====================================================
           MENSAJES
        ===================================================== */

        .mensaje-principal {

            width: 100%;

            max-width: 520px;

            font-size: 25px;

            line-height: 1.25;

            font-weight: 800;

            margin-bottom: 14px;
        }


        .mensaje-secundario {

            width: 100%;

            max-width: 470px;

            font-size: 15px;

            line-height: 1.5;

            opacity: 0.9;

            margin-bottom: 25px;
        }


        /* =====================================================
           PROMOCIÓN
        ===================================================== */

        .promocion {

            width: 100%;

            max-width: 540px;

            padding: 25px 20px;

            margin-bottom: 28px;

            border-radius: 18px;

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            position: relative;

            overflow: hidden;

            border: 1px solid rgba(255,255,255,0.35);

            box-shadow:
                0 10px 35px rgba(0,0,0,0.40);
        }


        .promocion::before {

            content: "";

            position: absolute;

            inset: 0;

            background: rgba(0,0,0,0.48);

            z-index: 0;
        }


        .promocion-contenido {

            position: relative;

            z-index: 1;
        }


        .promocion-etiqueta {

            font-size: 11px;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            margin-bottom: 8px;

            opacity: 0.9;
        }


        .promocion-titulo {

            font-size: 23px;

            font-weight: 800;

            margin-bottom: 8px;
        }


        .promocion-detalle {

            font-size: 16px;

            font-weight: bold;
        }


        /* =====================================================
           BOTÓN SIGUIENTE
        ===================================================== */

        .boton-siguiente {

            border: none;

            padding: 15px 48px;

            border-radius: 30px;

            background: white;

            color: #111;

            font-size: 17px;

            font-weight: 800;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.35);

            transition: transform 0.2s;
        }


        .boton-siguiente:hover {

            transform: scale(1.04);
        }


        /* =====================================================
           PÁGINA PRINCIPAL
        ===================================================== */

        .pagina-principal {

            display: none;

            min-height: 100vh;

            padding: 105px 20px 45px;

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;
        }


        .contenido-principal {

            width: 100%;

            max-width: 600px;

            margin: 0 auto;

            text-align: center;
        }


        .contenido-principal h2 {

            font-size: 30px;

            margin-bottom: 10px;
        }


        .contenido-principal > p {

            font-size: 16px;

            opacity: 0.85;

            margin-bottom: 35px;
        }


        /* =====================================================
           MENÚ
        ===================================================== */

        .menu-principal {

            display: grid;

            grid-template-columns: 1fr;

            gap: 18px;
        }


        .boton-menu {

            width: 100%;

            padding: 27px 20px;

            border: none;

            border-radius: 18px;

            background: rgba(255,255,255,0.96);

            color: #111;

            font-size: 23px;

            font-weight: 800;

            box-shadow:
                0 8px 28px rgba(0,0,0,0.35);
        }


        .boton-menu span {

            display: block;

            margin-top: 7px;

            font-size: 13px;

            font-weight: normal;

            opacity: 0.65;
        }


        /* =====================================================
           CONTACTO INFERIOR
        ===================================================== */

        .contacto-inferior {

            margin-top: 40px;

            padding: 18px;

            border-radius: 16px;

            background: rgba(0,0,0,0.65);
        }


        .contacto-inferior p {

            font-size: 14px;

            margin-bottom: 13px;
        }


        .botones-inferiores {

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;
        }


        .boton-inferior {

            border: none;

            padding: 11px 18px;

            border-radius: 25px;

            background: white;

            color: #111;

            font-weight: bold;
        }


        /* =====================================================
           CELULARES
        ===================================================== */

        @media (max-width: 500px) {

            .bienvenida h1 {

                font-size: 28px;
            }


            .mensaje-principal {

                font-size: 21px;
            }


            .promocion-titulo {

                font-size: 20px;
            }


            .boton-menu {

                font-size: 21px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BARRA SUPERIOR
    ===================================================== -->

    <header class="barra-vendedor">

        <div class="informacion-vendedor">

            <img
                id="fotoMini"
                class="foto-mini"
                src=""
                alt="Foto del vendedor"
            >

            <div>

                <div
                    id="nombreMini"
                    class="nombre-mini"
                ></div>

                <div
                    id="agenciaMini"
                    class="agencia-mini"
                ></div>

            </div>

        </div>


        <div class="botones-superiores">

            <button
                class="boton-contacto"
                onclick="contactarWhatsApp()"
                aria-label="WhatsApp"
            >
                💬
            </button>


            <button
                class="boton-contacto"
                onclick="llamarVendedor()"
                aria-label="Llamar"
            >
                📞
            </button>

        </div>

    </header>



    <!-- =====================================================
         BIENVENIDA
    ===================================================== -->

    <section
        id="pantallaBienvenida"
        class="bienvenida"
    >

        <img
            id="logoMarca"
            class="logo-marca"
            src=""
            alt="Logo de la agencia"
        >


        <img
            id="fotoVendedor"
            class="foto-vendedor"
            src=""
            alt="Foto del vendedor"
        >


        <h1 id="nombreVendedor"></h1>


        <div
            id="puestoVendedor"
            class="puesto"
        ></div>


        <div
            id="mensajePrincipal"
            class="mensaje-principal"
        ></div>


        <div
            id="mensajeSecundario"
            class="mensaje-secundario"
        ></div>


        <!-- =================================================
             PROMOCIÓN
             
             SI NO EXISTE INFORMACIÓN,
             ESTE BLOQUE SE OCULTA AUTOMÁTICAMENTE.
        ================================================== -->

        <div
            id="promocion"
            class="promocion"
            style="display: none;"
        >

            <div class="promocion-contenido">

                <div class="promocion-etiqueta">
                    Promoción especial
                </div>


                <div
                    id="tituloPromocion"
                    class="promocion-titulo"
                ></div>


                <div
                    id="detallePromocion"
                    class="promocion-detalle"
                ></div>

            </div>

        </div>


        <button
            class="boton-siguiente"
            onclick="mostrarPaginaPrincipal()"
        >
            Siguiente
        </button>

    </section>



    <!-- =====================================================
         PÁGINA PRINCIPAL
    ===================================================== -->

    <section
        id="pantallaPrincipal"
        class="pagina-principal"
    >

        <div class="contenido-principal">

            <h2>
                Bienvenido
            </h2>


            <p>
                Explora nuestros vehículos o calcula tu mensualidad.
            </p>


            <div class="menu-principal">

                <button
                    class="boton-menu"
                    onclick="abrirCatalogo()"
                >

                    🚗 CATÁLOGO

                    <span>
                        Conoce nuestros vehículos
                    </span>

                </button>


                <button
                    class="boton-menu"
                    onclick="abrirCotizador()"
                >

                    💰 COTIZAR

                    <span>
                        Calcula tu mensualidad
                    </span>

                </button>

            </div>


            <div class="contacto-inferior">

                <p>
                    ¿Necesitas información?
                </p>


                <div class="botones-inferiores">

                    <button
                        class="boton-inferior"
                        onclick="contactarWhatsApp()"
                    >
                        💬 WhatsApp
                    </button>


                    <button
                        class="boton-inferior"
                        onclick="llamarVendedor()"
                    >
                        📞 Llamar
                    </button>

                </div>

            </div>

        </div>

    </section>



    <script>


        /* =====================================================
           IDENTIFICADOR DEL VENDEDOR
           
           ESTE DATO SERÁ MUY IMPORTANTE.

           MÁS ADELANTE VENDRÁ DEL ENLACE/QR Y FIREBASE.
           
           EJEMPLO:
           
           /juan-perez
           
           EL SISTEMA SABRÁ QUE DEBE CARGAR
           LOS DATOS DE JUAN.
        ===================================================== */


        const vendedorId = obtenerVendedorId();



        /* =====================================================
           CONFIGURACIÓN TEMPORAL
           
           ESTO SOLO EXISTE MIENTRAS CONSTRUIMOS LA BASE.

           MÁS ADELANTE ESTA INFORMACIÓN VENDRÁ
           AUTOMÁTICAMENTE DESDE FIREBASE.
        ===================================================== */


        const CONFIGURACION = {

            vendedor: {

                nombre: "",

                puesto: "",

                telefono: "",

                whatsapp: "",

                foto: ""

            },


            agencia: {

                nombre: "",

                logo: ""

            },


            pagina: {

                fondoBienvenida: "",

                mensajePrincipal: "",

                mensajeSecundario: ""

            },


            promocion: {

                activa: false,

                titulo: "",

                detalle: "",

                fondo: ""

            }

        };



        /* =====================================================
           OBTENER ID DEL VENDEDOR
        ===================================================== */

        function obtenerVendedorId() {

            const parametros =
                new URLSearchParams(window.location.search);


            const id =
                parametros.get("vendedor");


            if (id) {

                return id;

            }


            return null;

        }



        /* =====================================================
           APLICAR CONFIGURACIÓN
        ===================================================== */

        function cargarConfiguracion() {


            /* -----------------------------------------------
               VENDEDOR
            ----------------------------------------------- */

            document.getElementById("nombreVendedor").textContent =
                CONFIGURACION.vendedor.nombre;


            document.getElementById("nombreMini").textContent =
                CONFIGURACION.vendedor.nombre;


            document.getElementById("puestoVendedor").textContent =
                CONFIGURACION.vendedor.puesto;


            document.getElementById("agenciaMini").textContent =
                CONFIGURACION.agencia.nombre;



            /* -----------------------------------------------
               FOTO
            ----------------------------------------------- */

            if (CONFIGURACION.vendedor.foto) {

                document.getElementById("fotoVendedor").src =
                    CONFIGURACION.vendedor.foto;


                document.getElementById("fotoMini").src =
                    CONFIGURACION.vendedor.foto;

            }



            /* -----------------------------------------------
               LOGO
            ----------------------------------------------- */

            if (CONFIGURACION.agencia.logo) {

                document.getElementById("logoMarca").src =
                    CONFIGURACION.agencia.logo;

            }



            /* -----------------------------------------------
               MENSAJES
            ----------------------------------------------- */

            document.getElementById("mensajePrincipal").textContent =
                CONFIGURACION.pagina.mensajePrincipal;


            document.getElementById("mensajeSecundario").textContent =
                CONFIGURACION.pagina.mensajeSecundario;



            /* -----------------------------------------------
               FONDO PRINCIPAL
            ----------------------------------------------- */

            if (CONFIGURACION.pagina.fondoBienvenida) {

                const fondo =
                    CONFIGURACION.pagina.fondoBienvenida;


                document.getElementById(
                    "pantallaBienvenida"
                ).style.backgroundImage =

                    `linear-gradient(
                        rgba(0,0,0,0.48),
                        rgba(0,0,0,0.72)
                    ),
                    url("${fondo}")`;


                document.getElementById(
                    "pantallaPrincipal"
                ).style.backgroundImage =

                    `linear-gradient(
                        rgba(0,0,0,0.58),
                        rgba(0,0,0,0.82)
                    ),
                    url("${fondo}")`;

            }



            /* -----------------------------------------------
               PROMOCIÓN
               
               SI ESTÁ DESACTIVADA O VACÍA,
               NO APARECE.
            ----------------------------------------------- */

            const promocion =
                CONFIGURACION.promocion;


            if (
                promocion.activa &&
                (
                    promocion.titulo ||
                    promocion.detalle
                )
            ) {

                const elemento =
                    document.getElementById("promocion");


                elemento.style.display =
                    "block";


                document.getElementById(
                    "tituloPromocion"
                ).textContent =
                    promocion.titulo;


                document.getElementById(
                    "detallePromocion"
                ).textContent =
                    promocion.detalle;



                if (promocion.fondo) {

                    elemento.style.backgroundImage =
                        `url("${promocion.fondo}")`;

                }

            }

        }



        /* =====================================================
           MOSTRAR PÁGINA PRINCIPAL
        ===================================================== */

        function mostrarPaginaPrincipal() {

            document.getElementById(
                "pantallaBienvenida"
            ).style.display = "none";


            document.getElementById(
                "pantallaPrincipal"
            ).style.display = "block";


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }



        /* =====================================================
           CATÁLOGO
           
           TEMPORALMENTE MOSTRAMOS UN AVISO.
           
           DESPUÉS ESTA FUNCIÓN ABRIRÁ EL CATÁLOGO REAL.
        ===================================================== */

        function abrirCatalogo() {

            alert(
                "El catálogo de vehículos se construirá en el siguiente paso."
            );

        }



        /* =====================================================
           COTIZADOR
           
           TEMPORALMENTE MOSTRAMOS UN AVISO.
           
           DESPUÉS ESTA FUNCIÓN ABRIRÁ EL COTIZADOR REAL.
        ===================================================== */

        function abrirCotizador() {

            alert(
                "El cotizador se construirá en el siguiente paso."
            );

        }



        /* =====================================================
           WHATSAPP
        ===================================================== */

        function contactarWhatsApp() {


            if (!CONFIGURACION.vendedor.whatsapp) {

                alert(
                    "El WhatsApp del vendedor todavía no está configurado."
                );

                return;

            }


            const mensaje =

                "Hola " +

                CONFIGURACION.vendedor.nombre +

                ", vi tu página y me gustaría recibir información.";


            const url =

                "https://wa.me/" +

                CONFIGURACION.vendedor.whatsapp +

                "?text=" +

                encodeURIComponent(mensaje);


            window.open(
                url,
                "_blank"
            );

        }



        /* =====================================================
           LLAMAR
        ===================================================== */

        function llamarVendedor() {


            if (!CONFIGURACION.vendedor.telefono) {

                alert(
                    "El teléfono del vendedor todavía no está configurado."
                );

                return;

            }


            window.location.href =

                "tel:" +

                CONFIGURACION.vendedor.telefono;

        }



        /* =====================================================
           INICIAR
        ===================================================== */

        cargarConfiguracion();


        /* =====================================================
           MOSTRAR ID EN CONSOLA DURANTE DESARROLLO
        ===================================================== */

        console.log(
            "Vendedor actual:",
            vendedorId
        );


    </script>


</body>

</html>
