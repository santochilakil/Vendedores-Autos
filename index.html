<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vendedores-Autos</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #d1d5db;
    }

    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }

    .bienvenida {
      background: white;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      text-align: center;
    }

    .bienvenida h2 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .bienvenida p {
      font-size: 18px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <header>
    <h1>Vendedores-Autos</h1>
    <p>Tu plataforma profesional para vender más autos</p>
  </header>

  <main>
    <section class="bienvenida">
      <h2>Bienvenido</h2>

      <p>
        Estamos construyendo tu nueva herramienta profesional
        para vendedores de autos.
      </p>
    </section>
  </main>

</body>
</html>
