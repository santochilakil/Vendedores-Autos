<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vendedores Autos</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #111;
            color: white;
        }


        body {
            overflow-x: hidden;
        }


        /* =====================================================
           BARRA SUPERIOR
        ===================================================== */

        .barra-vendedor {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;

            min-height: 72px;

            padding: 10px 15px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 12px;

            background: rgba(0,0,0,0.82);

            backdrop-filter: blur(8px);

            z-index: 100;

        }


        .informacion-vendedor {

            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;

        }


        .foto-mini {

            width: 48px;

            height: 48px;

            border-radius: 50%;

            object-fit: cover;

            border: 2px solid white;

            background: #333;

        }


        .nombre-mini {

            font-size: 16px;

            font-weight: 900;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .agencia-mini {

            font-size: 12px;

            color: #ccc;

            margin-top: 3px;

        }


        .botones-superiores {

            display: flex;

            gap: 8px;

        }


        .boton-contacto {

            width: 44px;

            height: 44px;

            border-radius: 50%;

            border: none;

            background: white;

            color: #111;

            font-size: 20px;

            cursor: pointer;

        }


        /* =====================================================
           BIENVENIDA
        ===================================================== */

        .bienvenida {

            min-height: 100vh;

            width: 100%;

            padding: 110px 20px 35px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            background:

                linear-gradient(
                    rgba(0,0,0,0.48),
                    rgba(0,0,0,0.72)
                ),

                #222;

            background-size: cover;

            background-position: center;

        }


        .logo-marca {

            width: 150px;

            max-width: 60vw;

            max-height: 110px;

            object-fit: contain;

            margin-bottom: 18px;

        }


        .foto-vendedor {

            width: 120px;

            height: 120px;

            object-fit: cover;

            border-radius: 50%;

            border: 4px solid white;

            margin-bottom: 18px;

            background: #333;

        }


        .bienvenida h1 {

            margin: 5px 0;

            font-size: 34px;

            font-weight: 900;

            text-shadow:
                0 3px 12px rgba(0,0,0,0.8);

        }


        .puesto {

            font-size: 16px;

            color: #ddd;

            margin-bottom: 18px;

        }


        .mensaje-principal {

            max-width: 700px;

            font-size: 25px;

            line-height: 1.25;

            font-weight: 900;

            margin: 10px auto;

        }


        .mensaje-secundario {

            max-width: 650px;

            font-size: 16px;

            line-height: 1.5;

            color: #eee;

            margin: 5px auto 20px;

        }


        /* =====================================================
           PROMOCIÓN
        ===================================================== */

        .promocion {

            width: 100%;

            max-width: 720px;

            min-height: 150px;

            margin: 15px auto 20px;

            padding: 25px;

            border-radius: 22px;

            display: none;

            align-items: center;

            justify-content: center;

            text-align: center;

            background-color: #222;

            background-size: cover;

            background-position: center;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.35);

            overflow: hidden;

        }


        .promocion-contenido {

            width: 100%;

            padding: 20px;

            border-radius: 16px;

            background: rgba(0,0,0,0.55);

        }


        .promocion-etiqueta {

            font-size: 12px;

            text-transform: uppercase;

            font-weight: 900;

            letter-spacing: 1px;

            margin-bottom: 8px;

            color: #ddd;

        }


        .promocion-titulo {

            font-size: 27px;

            font-weight: 900;

            line-height: 1.2;

        }


        .promocion-detalle {

            margin-top: 10px;

            font-size: 16px;

            line-height: 1.45;

        }


        /* =====================================================
           BOTÓN SIGUIENTE
        ===================================================== */

        .boton-siguiente {

            border: none;

            padding: 16px 32px;

            border-radius: 30px;

            background: white;

            color: #111;

            font-size: 18px;

            font-weight: 900;

            cursor: pointer;

            margin-top: 5px;

        }


        /* =====================================================
           PÁGINA PRINCIPAL
        ===================================================== */

        .pagina-principal {

            min-height: 100vh;

            width: 100%;

            display: none;

            padding: 115px 20px 40px;

            background:

                linear-gradient(
                    rgba(0,0,0,0.58),
                    rgba(0,0,0,0.82)
                ),

                #222;

            background-size: cover;

            background-position: center;

        }


        .contenido-principal {

            width: 100%;

            max-width: 850px;

            margin: auto;

            text-align: center;

        }


        .contenido-principal h2 {

            font-size: 32px;

            margin: 10px 0;

        }


        .contenido-principal > p {

            color: #ddd;

            font-size: 17px;

        }


        /* =====================================================
           MENÚ
        ===================================================== */

        .menu-principal {

            display: grid;

            grid-template-columns: 1fr;

            gap: 15px;

            margin-top: 30px;

        }


        .boton-menu {

            width: 100%;

            min-height: 120px;

            border: none;

            border-radius: 22px;

            background: rgba(255,255,255,0.94);

            color: #111;

            font-size: 25px;

            font-weight: 900;

            cursor: pointer;

            padding: 25px;

        }


        .boton-menu span {

            display: block;

            font-size: 14px;

            font-weight: normal;

            margin-top: 8px;

            color: #555;

        }


        /* =====================================================
           CONTACTO
        ===================================================== */

        .contacto-inferior {

            margin-top: 40px;

            padding: 20px;

            border-radius: 18px;

            background: rgba(0,0,0,0.65);

        }


        .contacto-inferior p {

            font-size: 15px;

            margin-top: 0;

            margin-bottom: 15px;

        }


        .botones-inferiores {

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;

        }


        .boton-inferior {

            border: none;

            padding: 13px 20px;

            border-radius: 25px;

            background: white;

            color: #111;

            font-weight: 900;

            cursor: pointer;

        }


        /* =====================================================
           CELULAR
        ===================================================== */

        @media (max-width: 500px) {

            .bienvenida h1 {
                font-size: 28px;
            }


            .mensaje-principal {
                font-size: 21px;
            }


            .promocion-titulo {
                font-size: 21px;
            }


            .boton-menu {
                font-size: 21px;
            }


            .foto-vendedor {
                width: 105px;
                height: 105px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BARRA SUPERIOR
    ===================================================== -->

    <header class="barra-vendedor">

        <div class="informacion-vendedor">

            <img
                id="fotoMini"
                class="foto-mini"

            >

            <div>

                <div

            </div>

        </div>


        <div class="botones-superiores">

            <button

            </button>


            <button

            >
                📞
            </button>

        </div>

    </header>



    <!-- =====================================================
         BIENVENIDA
    ===================================================== -->

    <section
        id="pantallaBienvenida"
        class="bienvenida"
    >

        <img
            id="logoMarca"
            class="logo-marca"
            src=""
            alt="Logo de la agencia"
        >


        <img
            id="fotoVendedor"
            class="foto-vendedor"
            src=""
            alt="Foto del vendedor"
        >


        <h1 id="nombreVendedor"></h1>


        <div
            id="puestoVendedor"

        ></div>


        <div
            id="mensajePrincipal"

        ></div>

            id="mensajeSecundario"
            class="mensaje-secundario"
        ></div>


        <!-- PROMOCIÓN -->

        <div
            id="promocion"

        >

            <div class="promocion-contenido">

                <div class="promocion-etiqueta">

                </div>


                <div
                    id="tituloPromocion"
                    class="promocion-titulo"
                ></div>


                <div
                    id="detallePromocion"

                ></div>

            </div>

        </div>


        <button
            class="boton-siguiente"
            onclick="mostrarPaginaPrincipal()"
        >
            Siguiente
        </button>

    </section>



    <!-- =====================================================
         PÁGINA PRINCIPAL
    ===================================================== -->

    <section
        id="pantallaPrincipal"
        class="pagina-principal"
    >

        <div class="contenido-principal">

            <h2>
                Bienvenido
            </h2>


            <p>
                Explora nuestros vehículos o calcula tu mensualidad.
            </p>


            <div class="menu-principal">

                <button
                    class="boton-menu"
                    onclick="abrirCatalogo()"
                >

                    🚗 CATÁLOGO

                    <span>
                        Conoce nuestros vehículos
                    </span>

                </button>


                <button
                    class="boton-menu"
                    onclick="abrirCotizador()"
                >

                    💰 COTIZAR

                    <span>
                        Calcula tu mensualidad
                    </span>

                </button>

            </div>


            <div class="contacto-inferior">

                <p>
                    ¿Necesitas información?
                </p>


                <div class="botones-inferiores">

                    <button
                        class="boton-inferior"
                        onclick="contactarWhatsApp()"
                    >
                        💬 WhatsApp
                    </button>


                    <button
                        class="boton-inferior"
                        onclick="llamarVendedor()"
                    >
                        📞 Llamar
                    </button>

                </div>

            </div>

        </div>

    </section>



    <!-- =====================================================
         FIREBASE
    ===================================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


    <script>

        /* =====================================================
           CONFIGURACIÓN FIREBASE
        ===================================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyBeJo2BM4l2MobQtw1R4vFRe0XU2qeRuMk",

            authDomain:
                "vendedores-autos.firebaseapp.com",

            projectId:
                "vendedores-autos",

            storageBucket:
                "vendedores-autos.firebasestorage.app",

            messagingSenderId:
                "1041752209924",

            appId:
                "1:1041752209924:web:1ffef37192c41496391351",

            measurementId:
                "G-0JZSD268GJ"

        };


        firebase.initializeApp(
            firebaseConfig
        );


        const db =
            firebase.firestore();


        const vendedoresRef =
            db.collection("vendedores");



        /* =====================================================
           IDENTIFICADOR DEL VENDEDOR

           EJEMPLO:

           ?vendedor=cesar-ayala
        ===================================================== */

        const vendedorId =
            obtenerVendedorId();



        /* =====================================================
           OBTENER ID
        ===================================================== */

        function obtenerVendedorId() {

            const parametros =
                new URLSearchParams(
                    window.location.search
                );


            return parametros.get(
                "vendedor"
            );

        }



        /* =====================================================
           CARGAR VENDEDOR
        ===================================================== */

        async function cargarVendedor() {

            console.log(
                "Vendedor solicitado:",
                vendedorId
            );


            if (!vendedorId) {

                mostrarError(
                    "Falta el vendedor en el enlace."
                );

                return;

            }


            try {

                const documento =
                    await vendedoresRef
                        .doc(vendedorId)
                        .get();


                console.log(
                    "Documento existe:",
                    documento.exists
                );


                if (!documento.exists) {

                    mostrarError(
                        "No encontramos este vendedor."
                    );

                    return;

                }


                const datos =
                    documento.data();


                console.log(
                    "Datos del vendedor:",
                    datos
                );


                aplicarDatos(
                    datos
                );


            }

            catch(error) {

                console.error(
                    "Error Firebase:",
                    error
                );


                mostrarError(
                    "No se pudo cargar la información."
                );

            }

        }



        /* =====================================================
           APLICAR DATOS
        ===================================================== */

        function aplicarDatos(
            datos
        ) {

            /* -----------------------------------------------
               NOMBRE
            ----------------------------------------------- */

            document.getElementById(
                "nombreVendedor"
            ).textContent =
                datos.nombre || "";


            document.getElementById(
                "nombreMini"
            ).textContent =
                datos.nombre || "";


            /* -----------------------------------------------
               AGENCIA
            ----------------------------------------------- */

            document.getElementById(
                "agenciaMini"
            ).textContent =
                datos.agencia || "";


            /* -----------------------------------------------
               PUESTO
            ----------------------------------------------- */

            document.getElementById(
                "puestoVendedor"
            ).textContent =
                datos.puesto ||
                "Asesor de ventas";


            /* -----------------------------------------------
               FOTO
            ----------------------------------------------- */

            const foto =
                datos.fotoVendedor ||
                datos.foto ||
                "";


            const fotoPrincipal =
                document.getElementById(
                    "fotoVendedor"
                );


            const fotoMini =
                document.getElementById(
                    "fotoMini"
                );


            if (foto) {

                fotoPrincipal.src =
                    foto;

                fotoMini.src =
                    foto;


                fotoPrincipal.style.display =
                    "block";

                fotoMini.style.display =
                    "block";

            }

            else {

                fotoPrincipal.style.display =
                    "none";

                fotoMini.style.display =
                    "none";

            }



            /* -----------------------------------------------
               LOGO
            ----------------------------------------------- */

            const logo =
                datos.logoAgencia ||
                datos.logo ||
                "";


            const logoElemento =
                document.getElementById(
                    "logoMarca"
                );


            if (logo) {

                logoElemento.src =
                    logo;

                logoElemento.style.display =
                    "block";

            }

            else {

                logoElemento.style.display =
                    "none";

            }



            /* -----------------------------------------------
               TÍTULO BIENVENIDA
            ----------------------------------------------- */

            document.getElementById(
                "mensajePrincipal"
            ).textContent =
                datos.tituloBienvenida ||
                "";


            /* -----------------------------------------------
               TEXTO BIENVENIDA
            ----------------------------------------------- */

            document.getElementById(
                "mensajeSecundario"
            ).textContent =
                datos.textoBienvenida ||
                "";



            /* -----------------------------------------------
               FONDO BIENVENIDA
            ----------------------------------------------- */

            if (
                datos.fondoBienvenida
            ) {

                const fondo =
                    datos.fondoBienvenida;


                document.getElementById(
                    "pantallaBienvenida"
                ).style.backgroundImage =

                    `linear-gradient(
                        rgba(0,0,0,0.48),
                        rgba(0,0,0,0.72)
                    ),
                    url("${fondo}")`;


                document.getElementById(
                    "pantallaPrincipal"
                ).style.backgroundImage =

                    `linear-gradient(
                        rgba(0,0,0,0.58),
                        rgba(0,0,0,0.82)
                    ),
                    url("${fondo}")`;

            }



            /* -----------------------------------------------
               PROMOCIÓN
            ----------------------------------------------- */

            cargarPromocion(
                datos
            );

        }



        /* =====================================================
           PROMOCIÓN
        ===================================================== */

        function cargarPromocion(
            datos
        ) {

            const titulo =
                datos.promoTitulo ||
                "";


            const texto =
                datos.promoTexto ||
                "";


            const descuento =
                datos.promoDescuento ||
                "";


            const fondo =
                datos.promoFondo ||
                "";


            const elemento =
                document.getElementById(
                    "promocion"
                );


            /*

               SI NO HAY TÍTULO:

               NO SE MUESTRA LA PROMOCIÓN.

            */

            if (!titulo.trim()) {

                elemento.style.display =
                    "none";

                return;

            }


            elemento.style.display =
                "flex";


            document.getElementById(
                "tituloPromocion"
            ).textContent =
                titulo;


            const detalles = [];


            if (
                texto.trim()
            ) {

                detalles.push(
                    texto
                );

            }


            if (
                descuento.trim()
            ) {

                detalles.push(
                    descuento
                );

            }


            document.getElementById(
                "detallePromocion"
            ).textContent =
                detalles.join(
                    " • "
                );


            if (fondo.trim()) {

                elemento.style.backgroundImage =
                    `url("${fondo}")`;

            }

        }



        /* =====================================================
           PÁGINA PRINCIPAL
        ===================================================== */

        function mostrarPaginaPrincipal() {

            document.getElementById(
                "pantallaBienvenida"
            ).style.display =
                "none";


            document.getElementById(
                "pantallaPrincipal"
            ).style.display =
                "block";


            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });

        }



        /* =====================================================
           CATÁLOGO
        ===================================================== */

       /* =====================================================
   CATÁLOGO
===================================================== */
function abrirCatalogo() {

    const catalogoExistente =
        document.getElementById("catalogoVehiculos");

    if (catalogoExistente) {
        catalogoExistente.remove();
        return;
    }

    const catalogo =
        document.createElement("div");

    catalogo.id = "catalogoVehiculos";

    catalogo.style.position = "fixed";
    catalogo.style.top = "0";
    catalogo.style.left = "0";
    catalogo.style.width = "100%";
    catalogo.style.height = "100%";
    catalogo.style.background = "#111";
    catalogo.style.zIndex = "9999";
    catalogo.style.overflowY = "auto";
    catalogo.style.padding = "90px 20px 40px";
    catalogo.style.boxSizing = "border-box";

    catalogo.innerHTML = `

        <div style="
            max-width:900px;
            margin:auto;
        ">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                margin-bottom:30px;
            ">

                <h2 style="
                    margin:0;
                    font-size:32px;
                    font-weight:900;
                    color:white;
                ">
                    🚗 Catálogo
                </h2>

                <button
                    onclick="cerrarCatalogo()"
                    style="
                        border:none;
                        background:white;
                        color:#111;
                        border-radius:30px;
                        padding:12px 22px;
                        font-size:16px;
                        font-weight:900;
                        cursor:pointer;
                    "
                >
                    Cerrar
                </button>

            </div>

            <div id="listaVehiculos">

                <div style="
                    background:#222;
                    border-radius:20px;
                    padding:30px;
                    text-align:center;
                    color:#ddd;
                    font-size:20px;
                ">
                    Cargando vehículos...
                </div>

            </div>

        </div>
    `;

    document.body.appendChild(catalogo);

    cargarVehiculos();
}


/* =====================================================
   CERRAR CATÁLOGO
===================================================== */

function cerrarCatalogo() {

    const catalogo =
        document.getElementById("catalogoVehiculos");

    if (catalogo) {
        catalogo.remove();
    }
}
function escapeHtml(valor) {

    return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =====================================================
   CARGAR VEHÍCULOS DEL VENDEDOR
===================================================== */

async function cargarVehiculos() {

    const contenedor =
        document.getElementById("listaVehiculos");

    if (!contenedor) {
        return;
    }

    if (!vendedorId) {

        contenedor.innerHTML = `
            <div style="
                background:#222;
                border-radius:20px;
                padding:30px;
                text-align:center;
                color:#ffb3b3;
                font-size:20px;
            ">
                No se encontró el vendedor.
            </div>
        `;

        return;
    }

    try {

        const vendedorRef =
            db
                .collection("vendedores")
                .doc(vendedorId);

        const documento =
            await vendedorRef.get();

        if (!documento.exists) {

            contenedor.innerHTML = `
                <div style="
                    background:#222;
                    border-radius:20px;
                    padding:30px;
                    text-align:center;
                    color:#ffb3b3;
                    font-size:20px;
                ">
                    No se encontró el vendedor.
                </div>
            `;

            return;
        }

        const datos =
            documento.data();

        const vehiculos =
            Array.isArray(datos.vehiculos)
                ? datos.vehiculos
                : [];

        if (vehiculos.length === 0) {

            contenedor.innerHTML = `
                <div style="
                    background:#222;
                    border-radius:20px;
                    padding:40px 25px;
                    text-align:center;
                    color:#ddd;
                ">

                    <div style="
                        font-size:60px;
                        margin-bottom:15px;
                    ">
                        🚗
                    </div>

                    <h3 style="
                        color:white;
                        font-size:28px;
                        margin:10px 0;
                    ">
                        Próximamente
                    </h3>

                    <p style="
                        font-size:18px;
                        line-height:1.5;
                    ">
                        Los vehículos estarán disponibles próximamente.
                    </p>

                </div>
            `;

            return;
        }

        contenedor.innerHTML =
            vehiculos
                .filter(vehiculo => vehiculo.activo !== false)
                .map(vehiculo => {

                    return `
                        <div style="
                            background:#222;
                            border-radius:22px;
                            padding:25px;
                            margin-bottom:20px;
                            color:white;
                        ">

                            ${
                                vehiculo.foto
                                    ? `
                                        <img
                                            src="${escapeHtml(vehiculo.foto)}"
                                            alt="${escapeHtml(vehiculo.nombre || "Vehículo")}"
                                            style="
                                                width:100%;
                                                max-height:350px;
                                                object-fit:cover;
                                                border-radius:18px;
                                                display:block;
                                                margin-bottom:20px;
                                            "
                                        >
                                    `
                                    : `
                                        <div style="
                                            background:#181818;

                );

                return;

                "asesor";


            const mensaje =
                "Hola " +
                nombre +
                ", vi tu página y me gustaría recibir información.";


            const url =
                "https://wa.me/" +
                whatsapp +
                "?text=" +
                encodeURIComponent(
                    mensaje
                );


            window.open(
                url,
                "_blank"
            );

        }

                return;

            }


            window.location.href =

                telefono;

        }
