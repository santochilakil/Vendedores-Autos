<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Panel de Administración</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, Helvetica, sans-serif;

            background: #f4f4f4;

            color: #111;

            min-height: 100vh;
        }


        button,
        input {

            font-family: inherit;
        }


        /* =====================================================
           LOGIN
        ===================================================== */

        #pantallaLogin {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    rgba(0,0,0,0.70),
                    rgba(0,0,0,0.85)
                ),
                url("fondo-bienvenida.jpeg");

            background-size: cover;

            background-position: center;
        }


        .caja-login {

            width: 100%;

            max-width: 400px;

            padding: 35px 25px;

            border-radius: 20px;

            background: rgba(0,0,0,0.82);

            border: 1px solid rgba(255,255,255,0.20);

            text-align: center;

            box-shadow:
                0 15px 50px rgba(0,0,0,0.50);

            color: white;
        }


        .caja-login h1 {

            font-size: 28px;

            margin-bottom: 10px;
        }


        .caja-login p {

            font-size: 14px;

            opacity: 0.75;

            margin-bottom: 25px;
        }


        .campo-login {

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid #555;

            background: #222;

            color: white;

            font-size: 16px;

            outline: none;

            margin-bottom: 15px;
        }


        .boton-login {

            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 14px;

            background: white;

            color: #111;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }


        .mensaje-error {

            color: #ff8080;

            font-size: 13px;

            margin-top: 12px;

            display: none;
        }



        /* =====================================================
           PANEL
        ===================================================== */

        #panelAdmin {

            display: none;

            min-height: 100vh;
        }


        .encabezado {

            background: #111;

            color: white;

            padding: 17px 18px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            position: sticky;

            top: 0;

            z-index: 100;
        }


        .encabezado h1 {

            font-size: 20px;
        }


        .boton-salir {

            border: none;

            border-radius: 20px;

            padding: 9px 15px;

            background: white;

            color: #111;

            font-weight: bold;

            cursor: pointer;
        }


        .contenido {

            width: 100%;

            max-width: 900px;

            margin: auto;

            padding: 25px 18px 60px;
        }



        /* =====================================================
           MENÚ
        ===================================================== */

        .menu-admin {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

            margin-bottom: 20px;
        }


        .tarjeta-menu {

            min-height: 135px;

            border: none;

            border-radius: 18px;

            background: white;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.10);

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            padding: 20px;
        }


        .tarjeta-menu span {

            display: block;

            font-size: 34px;

            margin-bottom: 12px;
        }



        /* =====================================================
           SECCIONES
        ===================================================== */

        .seccion {

            display: none;

            background: white;

            padding: 22px;

            border-radius: 18px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);

            margin-bottom: 20px;
        }


        .seccion.activa {

            display: block;
        }


        .seccion h2 {

            font-size: 23px;

            margin-bottom: 20px;
        }



        /* =====================================================
           FORMULARIOS
        ===================================================== */

        .grupo {

            margin-bottom: 16px;
        }


        .grupo label {

            display: block;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        .grupo input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 9px;

            font-size: 15px;

            background: white;

            color: #111;

            outline: none;
        }


        .grupo input:focus {

            border-color: #111;
        }


        .boton-guardar {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 11px;

            background: #111;

            color: white;

            font-weight: bold;

            font-size: 16px;

            cursor: pointer;

            margin-top: 5px;
        }



        /* =====================================================
           LISTA VENDEDORES
        ===================================================== */

        .lista-vendedores {

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .vendedor-item {

            width: 100%;

            padding: 16px;

            border: 1px solid #ddd;

            border-radius: 12px;

            background: #fafafa;

            cursor: pointer;

            text-align: left;
        }


        .vendedor-item strong {

            display: block;

            font-size: 17px;

            margin-bottom: 5px;
        }


        .vendedor-item small {

            display: block;

            color: #666;

            margin-bottom: 4px;
        }


        .vendedor-item .id {

            font-size: 11px;

            color: #999;
        }


        .sin-vendedores {

            padding: 20px;

            text-align: center;

            color: #777;
        }



        /* =====================================================
           MENSAJES
        ===================================================== */

        .mensaje-exito {

            display: none;

            margin-top: 14px;

            padding: 12px;

            border-radius: 10px;

            background: #e7f6ea;

            color: #216b2e;

            font-size: 14px;

            text-align: center;
        }


        .mensaje-cargando {

            display: none;

            margin-top: 14px;

            padding: 12px;

            border-radius: 10px;

            background: #eeeeee;

            color: #555;

            font-size: 14px;

            text-align: center;
        }



        /* =====================================================
           VENDEDOR SELECCIONADO
        ===================================================== */

        .vendedor-seleccionado {

            background: #111;

            color: white;

            padding: 15px;

            border-radius: 12px;

            margin-bottom: 20px;
        }


        .vendedor-seleccionado small {

            opacity: 0.7;

            display: block;

            margin-top: 4px;
        }



        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 600px) {

            .menu-admin {

                grid-template-columns: 1fr;
            }


            .encabezado h1 {

                font-size: 17px;
            }


            .contenido {

                padding-left: 14px;

                padding-right: 14px;
            }

        }

    </style>

</head>


<body>



    <!-- =====================================================
         LOGIN
    ===================================================== -->

    <section id="pantallaLogin">

        <div class="caja-login">

            <h1>
                Mi Panel
            </h1>

            <p>
                Administración de Vendedores-Autos
            </p>


            <input
                id="passwordAdmin"
                class="campo-login"
                type="password"
                placeholder="Contraseña"
                autocomplete="current-password"
            >


            <button
                class="boton-login"
                onclick="iniciarSesion()"
            >
                Entrar
            </button>


            <div
                id="mensajeError"
                class="mensaje-error"
            >
                Contraseña incorrecta.
            </div>

        </div>

    </section>



    <!-- =====================================================
         PANEL
    ===================================================== -->

    <section id="panelAdmin">


        <header class="encabezado">

            <h1>
                Mi Panel de Administración
            </h1>


            <button
                class="boton-salir"
                onclick="cerrarSesion()"
            >
                Salir
            </button>

        </header>



        <main class="contenido">


            <!-- =================================================
                 MENÚ PRINCIPAL
            ================================================= -->

            <div class="menu-admin">


                <button
                    class="tarjeta-menu"
                    onclick="mostrarSeccion('agregar')"
                >

                    <span>
                        ➕
                    </span>

                    Agregar vendedor

                </button>


                <button
                    class="tarjeta-menu"
                    onclick="mostrarSeccion('seleccionar')"
                >

                    <span>
                        👤
                    </span>

                    Seleccionar vendedor

                </button>

            </div>



            <!-- =================================================
                 AGREGAR VENDEDOR
            ================================================= -->

            <section
                id="seccion-agregar"
                class="seccion"
            >

                <h2>
                    Agregar vendedor
                </h2>


                <div class="grupo">

                    <label>
                        Nombre del vendedor
                    </label>

                    <input
                        id="nuevoNombre"
                        type="text"
                        placeholder="Ej. Carlos Pérez"
                    >

                </div>


                <div class="grupo">

                    <label>
                        Nombre de la agencia
                    </label>

                    <input
                        id="nuevaAgencia"
                        type="text"
                        placeholder="Ej. Mitsubishi Cancún"
                    >

                </div>


                <div class="grupo">

                    <label>
                        Teléfono
                    </label>

                    <input
                        id="nuevoTelefono"
                        type="tel"
                        placeholder="Ej. 9981234567"
                    >

                </div>


                <div class="grupo">

                    <label>
                        WhatsApp
                    </label>

                    <input
                        id="nuevoWhatsApp"
                        type="tel"
                        placeholder="Ej. 529981234567"
                    >

                </div>


                <div class="grupo">

                    <label>
                        Identificador del vendedor
                    </label>

                    <input
                        id="nuevoId"
                        type="text"
                        placeholder="Ej. carlos-perez"
                    >

                </div>


                <button
                    id="botonGuardarVendedor"
                    class="boton-guardar"
                    onclick="guardarVendedor()"
                >
                    💾 Guardar vendedor
                </button>


                <div
                    id="mensajeCargando"
                    class="mensaje-cargando"
                >
                    Guardando vendedor...
                </div>


                <div
                    id="mensajeExito"
                    class="mensaje-exito"
                >
                    Vendedor guardado correctamente.
                </div>

            </section>



            <!-- =================================================
                 SELECCIONAR VENDEDOR
            ================================================= -->

            <section
                id="seccion-seleccionar"
                class="seccion"
            >

                <h2>
                    Seleccionar vendedor
                </h2>


                <div
                    id="listaVendedores"
                    class="lista-vendedores"
                >

                    <div class="sin-vendedores">
                        Cargando vendedores...
                    </div>

                </div>

            </section>



            <!-- =================================================
                 EDITAR VENDEDOR
            ================================================= -->

            <section
                id="seccion-editar"
                class="seccion"
            >

                <h2>
                    Editar vendedor
                </h2>


                <div
                    id="vendedorSeleccionado"
                    class="vendedor-seleccionado"
                >

                    Vendedor seleccionado

                </div>


                <div class="grupo">

                    <label>
                        Nombre del vendedor
                    </label>

                    <input
                        id="editarNombre"
                        type="text"
                    >

                </div>


                <div class="grupo">

                    <label>
                        Nombre de la agencia
                    </label>

                    <input
                        id="editarAgencia"
                        type="text"
                    >

                </div>


                <div class="grupo">

                    <label>
                        Teléfono
                    </label>

                    <input
                        id="editarTelefono"
                        type="tel"
                    >

                </div>


                <div class="grupo">

                    <label>
                        WhatsApp
                    </label>

                    <input
                        id="editarWhatsApp"
                        type="tel"
                    >

                </div>


                <div class="grupo">

                    <label>
                        Identificador
                    </label>

                    <input
                        id="editarId"
                        type="text"
                    >

                </div>


                <button
                    class="boton-guardar"
                    onclick="guardarCambiosVendedor()"
                >
                    💾 Guardar cambios
                </button>


                <div
                    id="mensajeEditarExito"
                    class="mensaje-exito"
                >
                    Cambios guardados correctamente.
                </div>

            </section>


        </main>

    </section>



    <!-- =====================================================
         FIREBASE
         
         USAMOS LA VERSIÓN COMPAT PARA QUE EL CÓDIGO
         SEA SENCILLO DE MANTENER.
    ===================================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>



    <script>


        /* =====================================================
           CONFIGURACIÓN FIREBASE
        ===================================================== */

        const firebaseConfig = {

            apiKey:
                "AIzaSyBeJo2BM4l2MobQtw1R4vFRe0XU2qeRuMk",

            authDomain:
                "vendedores-autos.firebaseapp.com",

            projectId:
                "vendedores-autos",

            storageBucket:
                "vendedores-autos.firebasestorage.app",

            messagingSenderId:
                "1041752209924",

            appId:
                "1:1041752209924:web:1ffef37192c41496391351",

            measurementId:
                "G-0JZSD268GJ"

        };


        /* =====================================================
           INICIAR FIREBASE
        ===================================================== */

        firebase.initializeApp(
            firebaseConfig
        );


        const db =
            firebase.firestore();


        /* =====================================================
           REFERENCIA A VENDEDORES
        ===================================================== */

        const vendedoresRef =
            db.collection("vendedores");



        /* =====================================================
           CONTRASEÑA TEMPORAL
           
           IMPORTANTE:
           
           ESTA NO ES TODAVÍA LA SEGURIDAD DEFINITIVA.
           
           LA USAMOS PARA PROBAR EL PANEL.
        ===================================================== */

        const CONTRASENA_ADMIN =
            "1234";



        /* =====================================================
           VARIABLES
        ===================================================== */

        let vendedorSeleccionadoId =
            null;



        /* =====================================================
           INICIAR SESIÓN
        ===================================================== */

        function iniciarSesion() {


            const password =
                document.getElementById(
                    "passwordAdmin"
                ).value;


            if (
                password ===
                CONTRASENA_ADMIN
            ) {


                document.getElementById(
                    "pantallaLogin"
                ).style.display =
                    "none";


                document.getElementById(
                    "panelAdmin"
                ).style.display =
                    "block";


                document.getElementById(
                    "mensajeError"
                ).style.display =
                    "none";


                cargarVendedores();

            }

            else {


                document.getElementById(
                    "mensajeError"
                ).style.display =
                    "block";

            }

        }



        /* =====================================================
           CERRAR SESIÓN
        ===================================================== */

        function cerrarSesion() {


            document.getElementById(
                "panelAdmin"
            ).style.display =
                "none";


            document.getElementById(
                "pantallaLogin"
            ).style.display =
                "flex";


            document.getElementById(
                "passwordAdmin"
            ).value =
                "";


            vendedorSeleccionadoId =
                null;

        }



        /* =====================================================
           MOSTRAR SECCIÓN
        ===================================================== */

        function mostrarSeccion(nombre) {


            const secciones =
                document.querySelectorAll(
                    ".seccion"
                );


            secciones.forEach(
                function(seccion) {

                    seccion.classList.remove(
                        "activa"
                    );

                }
            );


            const seleccion =
                document.getElementById(
                    "seccion-" + nombre
                );


            if (seleccion) {

                seleccion.classList.add(
                    "activa"
                );

            }


            if (
                nombre ===
                "seleccionar"
            ) {

                cargarVendedores();

            }

        }



        /* =====================================================
           NORMALIZAR ID
           
           Convierte:
           
           Carlos Pérez
           
           en:
           
           carlos-perez
        ===================================================== */

        function normalizarId(texto) {


            return texto

                .toLowerCase()

                .normalize("NFD")

                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                )

                .replace(
                    /[^a-z0-9]+/g,
                    "-"
                )

                .replace(
                    /^-+|-+$/g,
                    "");

        }



        /* =====================================================
           GUARDAR VENDEDOR
        ===================================================== */

        async function guardarVendedor() {


            const nombre =
                document.getElementById(
                    "nuevoNombre"
                ).value.trim();


            const agencia =
                document.getElementById(
                    "nuevaAgencia"
                ).value.trim();


            const telefono =
                document.getElementById(
                    "nuevoTelefono"
                ).value.trim();


            const whatsapp =
                document.getElementById(
                    "nuevoWhatsApp"
                ).value.trim();


            let id =
                document.getElementById(
                    "nuevoId"
                ).value.trim();


            /* ---------------------------------------------
               VALIDACIÓN
            --------------------------------------------- */

            if (
                !nombre ||
                !agencia
            ) {

                alert(
                    "El nombre del vendedor y la agencia son obligatorios."
                );

                return;

            }


            /* ---------------------------------------------
               GENERAR ID SI ESTÁ VACÍO
            --------------------------------------------- */

            if (!id) {

                id =
                    normalizarId(
                        nombre
                    );

            }


            if (!id) {

                alert(
                    "No se pudo crear el identificador del vendedor."
                );

                return;

            }


            id =
                normalizarId(id);


            /* ---------------------------------------------
               MOSTRAR CARGANDO
            --------------------------------------------- */

            document.getElementById(
                "mensajeCargando"
            ).style.display =
                "block";


            document.getElementById(
                "mensajeExito"
            ).style.display =
                "none";


            document.getElementById(
                "botonGuardarVendedor"
            ).disabled =
                true;


            try {


                /* -----------------------------------------
                   COMPROBAR SI YA EXISTE
                ----------------------------------------- */

                const documento =
                    await vendedoresRef
                        .doc(id)
                        .get();


                if (
                    documento.exists
                ) {

                    alert(
                        "Ese identificador ya existe. Usa otro."
                    );

                    document.getElementById(
                        "mensajeCargando"
                    ).style.display =
                        "none";


                    document.getElementById(
                        "botonGuardarVendedor"
                    ).disabled =
                        false;

                    return;

                }



                /* -----------------------------------------
                   CREAR VENDEDOR
                ----------------------------------------- */

                await vendedoresRef
                    .doc(id)
                    .set({

                        id: id,

                        nombre: nombre,

                        agencia: agencia,

                        telefono: telefono,

                        whatsapp: whatsapp,

                        fechaCreacion:
                            firebase.firestore.FieldValue.serverTimestamp(),

                        activo: true

                    });



                /* -----------------------------------------
                   ÉXITO
                ----------------------------------------- */

                document.getElementById(
                    "mensajeCargando"
                ).style.display =
                    "none";


                document.getElementById(
                    "mensajeExito"
                ).style.display =
                    "block";


                limpiarFormulario();


                cargarVendedores();


            }

            catch(error) {


                console.error(
                    "Error al guardar vendedor:",
                    error
                );


                alert(
                    "No se pudo guardar el vendedor.\n\n" +
                    error.message
                );


                document.getElementById(
                    "mensajeCargando"
                ).style.display =
                    "none";

            }


            document.getElementById(
                "botonGuardarVendedor"
            ).disabled =
                false;

        }



        /* =====================================================
           LIMPIAR FORMULARIO
        ===================================================== */

        function limpiarFormulario() {


            document.getElementById(
                "nuevoNombre"
            ).value =
                "";


            document.getElementById(
                "nuevaAgencia"
            ).value =
                "";


            document.getElementById(
                "nuevoTelefono"
            ).value =
                "";


            document.getElementById(
                "nuevoWhatsApp"
            ).value =
                "";


            document.getElementById(
                "nuevoId"
            ).value =
                "";

        }



        /* =====================================================
           CARGAR VENDEDORES DESDE FIRESTORE
        ===================================================== */

        async function cargarVendedores() {


            const lista =
                document.getElementById(
                    "listaVendedores"
                );


            lista.innerHTML =

                `<div class="sin-vendedores">
                    Cargando vendedores...
                </div>`;


            try {


                const snapshot =
                    await vendedoresRef
                        .orderBy(
                            "nombre"
                        )
                        .get();


                lista.innerHTML =
                    "";


                if (
                    snapshot.empty
                ) {

                    lista.innerHTML =

                        `<div class="sin-vendedores">
                            Todavía no hay vendedores registrados.
                        </div>`;

                    return;

                }


                snapshot.forEach(
                    function(doc) {


                        const vendedor =
                            doc.data();


                        const elemento =
                            document.createElement(
                                "button"
                            );


                        elemento.className =
                            "vendedor-item";


                        elemento.innerHTML =

                            `<strong>
                                ${escaparHTML(
                                    vendedor.nombre || ""
                                )}
                            </strong>

                            <small>
                                ${escaparHTML(
                                    vendedor.agencia || ""
                                )}
                            </small>

                            <div class="id">
                                ID: ${escaparHTML(
                                    vendedor.id || doc.id
                                )}
                            </div>`;


                        elemento.onclick =
                            function() {

                                seleccionarVendedor(
                                    doc.id,
                                    vendedor
                                );

                            };


                        lista.appendChild(
                            elemento
                        );

                    }
                );


            }

            catch(error) {


                console.error(
                    error
                );


                lista.innerHTML =

                    `<div class="sin-vendedores">
                        No se pudieron cargar los vendedores.
                    </div>`;

            }

        }



        /* =====================================================
           SELECCIONAR VENDEDOR
        ===================================================== */

        function seleccionarVendedor(
            id,
            vendedor
        ) {


            vendedorSeleccionadoId =
                id;


            document.getElementById(
                "editarNombre"
            ).value =
                vendedor.nombre || "";


            document.getElementById(
                "editarAgencia"
            ).value =
                vendedor.agencia || "";


            document.getElementById(
                "editarTelefono"
            ).value =
                vendedor.telefono || "";


            document.getElementById(
                "editarWhatsApp"
            ).value =
                vendedor.whatsapp || "";


            document.getElementById(
                "editarId"
            ).value =
                vendedor.id || id;


            document.getElementById(
                "vendedorSeleccionado"
            ).innerHTML =

                `<strong>
                    ${escaparHTML(
                        vendedor.nombre || ""
                    )}
                </strong>

                <small>
                    ID: ${escaparHTML(
                        vendedor.id || id
                    )}
                </small>`;


            mostrarSeccion(
                "editar"
            );

        }



        /* =====================================================
           GUARDAR CAMBIOS DEL VENDEDOR
        ===================================================== */

        async function guardarCambiosVendedor() {


            if (
                !vendedorSeleccionadoId
            ) {

                alert(
                    "Primero selecciona un vendedor."
                );

                return;

            }


            const nombre =
                document.getElementById(
                    "editarNombre"
                ).value.trim();


            const agencia =
                document.getElementById(
                    "editarAgencia"
                ).value.trim();


            const telefono =
                document.getElementById(
                    "editarTelefono"
                ).value.trim();


            const whatsapp =
                document.getElementById(
                    "editarWhatsApp"
                ).value.trim();


            const nuevoId =
                normalizarId(
                    document.getElementById(
                        "editarId"
                    ).value.trim()
                );


            if (
                !nombre ||
                !agencia ||
                !nuevoId
            ) {

                alert(
                    "Nombre, agencia e identificador son obligatorios."
                );

                return;

            }


            try {


                /* -----------------------------------------
                   SI EL ID CAMBIÓ
                ----------------------------------------- */

                if (
                    nuevoId !==
                    vendedorSeleccionadoId
                ) {


                    const nuevoDocumento =
                        await vendedoresRef
                            .doc(nuevoId)
                            .get();


                    if (
                        nuevoDocumento.exists
                    ) {

                        alert(
                            "Ese nuevo identificador ya está utilizado."
                        );

                        return;

                    }


                    const datosActualizados = {

                        id: nuevoId,

                        nombre: nombre,

                        agencia: agencia,

                        telefono: telefono,

                        whatsapp: whatsapp

                    };


                    await vendedoresRef
                        .doc(nuevoId)
                        .set(
                            datosActualizados
                        );


                    await vendedoresRef
                        .doc(
                            vendedorSeleccionadoId
                        )
                        .delete();


                    vendedorSeleccionadoId =
                        nuevoId;

                }

                else {


                    await vendedoresRef
                        .doc(
                            vendedorSeleccionadoId
                        )
                        .update({

                            nombre: nombre,

                            agencia: agencia,

                            telefono: telefono,

                            whatsapp: whatsapp

                        });

                }


                document.getElementById(
                    "mensajeEditarExito"
                ).style.display =
                    "block";


                cargarVendedores();


            }

            catch(error) {


                console.error(
                    error
                );


                alert(
                    "No se pudieron guardar los cambios.\n\n" +
                    error.message
                );

            }

        }



        /* =====================================================
           PROTEGER TEXTO HTML
        ===================================================== */

        function escaparHTML(texto) {


            return String(texto)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }



        /* =====================================================
           ENTER PARA LOGIN
        ===================================================== */

        document.getElementById(
            "passwordAdmin"
        ).addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key ===
                    "Enter"
                ) {

                    iniciarSesion();

                }

            }
        );


    </script>
